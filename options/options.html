<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Email Alias</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Header Icon -->
    <div class="header-icon">
      <img src="../icons/icon-48.png" alt="Icon" style="width: 48px; height: 48px" />
    </div>

    <h1>Dynamic Email Alias</h1>
    <p class="subtitle">Manage your custom domains for smart email generation.</p>

    <!-- General Settings Card -->
    <div class="card">
      <h2>Extension Settings</h2>

      <div class="settings-row">
        <input type="checkbox" id="useSyncToggle" />
        <label for="useSyncToggle" class="settings-label"
          >Enable Firefox Sync (sync settings across devices)</label
        >
      </div>
    </div>

    <!-- Main Settings Card -->
    <div class="card">
      <h2>Domain Configuration</h2>
      <p class="description">Add the domains you want to use for your email aliases.</p>

      <!-- Domain List Container -->
      <div id="domainList" class="domain-list">
        <!-- Domain items will be injected here -->
      </div>

      <!-- Add New Domain Section -->
      <div class="input-group">
        <div class="input-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            ></path>
          </svg>
        </div>
        <input type="text" id="newDomainInput" placeholder="Add new domain (e.g. mydomain.com)" />
      </div>

      <button id="addDomainBtn" class="btn-primary">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          style="margin-right: 8px"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Domain
      </button>
      <div id="status" class="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
