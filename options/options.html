<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dynamic Email Alias</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Header Icon -->
    <div class="header-icon">
      <img src="../icons/icon-48.png" alt="Icon" style="width: 48px; height: 48px" />
    </div>

    <h1>Dynamic Email Alias</h1>
    <p class="subtitle">Manage your custom domains for smart email generation.</p>

    <!-- General Settings Card -->
    <div class="card">
      <h2>Extension Settings</h2>

      <div style="display: flex; align-items: center; gap: 8px; margin-top: 16px">
        <input type="checkbox" id="includeTldToggle" checked />
        <label for="includeTldToggle" style="margin: 0; cursor: pointer"
          >Include TLD in alias (netflix -> netflix.com)</label
        >
      </div>
    </div>

    <!-- Domain Settings Card -->
    <div class="card">
      <h2>Domain Configuration</h2>
      <p class="description">Add the domains you want to use for your email aliases.</p>

      <!-- Domain List Container -->
      <div id="domainList" class="domain-list">
        <!-- Domain items will be injected here -->
      </div>

      <!-- Add New Domain Section -->
      <div class="input-group">
        <div class="input-icon">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
            ></path>
          </svg>
        </div>
        <input
          type="text"
          id="newDomainInput"
          placeholder="Add new domain (e.g. mydomain.com)"
          pattern="^([a-zA-Z0-9\-]+\.)+[a-zA-Z]{2,}$"
          title="Please enter a valid domain name (e.g., example.com)"
        />
      </div>

      <!-- Prefix input moved below the domain input -->
      <div class="input-group">
        <input
          type="text"
          id="newPrefixInput"
          placeholder="Optional Prefix (e.g. junk_)"
          pattern="^[a-zA-Z0-9._+\-]*$"
          title="Only letters, numbers, periods, underscores, hyphens, and plus signs are allowed."
        />
      </div>

      <button id="addDomainBtn" class="btn-primary">
        <svg
          class="btn-icon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Domain
      </button>
      <div id="status" class="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
